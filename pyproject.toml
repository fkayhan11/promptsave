[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "promptsave"
version = "1.1.0"
description = "Automatic, encrypted prompt history vault for Claude Code, OpenAI Codex CLI, Antigravity CLI, Gemini CLI, and Cursor."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
keywords = [
    "claude-code",
    "codex",
    "antigravity",
    "gemini-cli",
    "cursor",
    "ai-cli",
    "prompt-history",
    "encryption",
    "developer-tools",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/fkayhan11/promptsave"
Repository = "https://github.com/fkayhan11/promptsave"
Issues = "https://github.com/fkayhan11/promptsave/issues"

[project.scripts]
promptsave = "promptsave.cli:main"

[tool.setuptools.packages.find]
include = ["promptsave*"]
